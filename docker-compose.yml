# Local development infrastructure. Use docker-compose.test.yml for tests.
# Credentials are for this machine only. Ports listen on the loopback interface.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: softtech
      POSTGRES_PASSWORD: softtech
      POSTGRES_DB: softtech
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U softtech -d softtech']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
