# Isolated test infrastructure. This file does not use the development volume.
# Removing these volumes does not remove docker-compose.dev.yml data.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: softtech
      POSTGRES_PASSWORD: softtech
      POSTGRES_DB: softtech_test
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U softtech -d softtech_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
